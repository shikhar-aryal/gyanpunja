<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="icon" type="image/user" href="/img/3d-icon-of-contact-free-png.png">
</head>
<body>
    <div class="contact-form-container">
        <h2 class="animated-text">Contact Us</h2>
        <form action="#" method="post" class="contact-form">
            <div class="input-group">
                <label for="name" class="animated-text">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="input-group">
                <label for="email" class="animated-text">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="message" class="animated-text">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Your message" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
        
        <div class="contact-methods">
            <h3 class="animated-text">Other Ways to Reach Us</h3>
            <ul>
                <li>
                    <a href="https://www.facebook.com/gyanpunja2053" target="_blank" class="animated-text">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook Icon" class="icon">
                        Facebook
                    </a>
                </li>
                <li>
                    <a href="tel:076-550117" class="animated-text">
                        <img src="https://cdn-icons-png.flaticon.com/512/126/126341.png" alt="Phone Icon" class="icon">
                        Call Us: 076-550117
                    </a>
                </li>
                <li>
                    <a href="mailto:gyanpunja2053@gmail.com" class="animated-text">
                        <img src="https://cdn-icons-png.flaticon.com/512/281/281769.png" alt="Email Icon" class="icon">
                        Email: info@example.com
                    </a>
                </li>
                <li>
                    <a href="M5VR+X23, Banaganga 32800" target="_blank" class="animated-text">
                        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="Location Icon" class="icon">
                        Visit Us: Banganga-2 Rajpur, Kapilvastu, Nepal🙏
                    </a>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
